name: opcontrol-parental

services:
  db:
    image: postgres:17.6-bookworm
    container_name: parental-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: parental
      POSTGRES_USER: parental
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      TZ: UTC
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parental -d parental"]
      interval: 10s
      timeout: 5s
      retries: 12

  web:
    image: ${WEB_IMAGE:-ghcr.io/ziur-vela/parental-opcontrol:latest}
    container_name: parental-web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      ConnectionStrings__Default: Host=db;Database=parental;Username=parental;Password=${POSTGRES_PASSWORD}
      DataProtection__Path: /var/lib/opcontrol-parental/keys
      Database__Migrate: "true"
      PublicBaseUrl: ${PUBLIC_BASE_URL:-http://localhost:8096}
      Email__Staging: "false"
      Email__FromName: "Parental OpControl"
      Releases__Path: /var/lib/opcontrol-parental/releases
      Updater__BaseUrl: http://updater:8098
      Updater__Secret: ${UPDATER_SECRET:?set UPDATER_SECRET in .env}
      TZ: UTC
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8096}:8080"
    volumes:
      - ./data/keys:/var/lib/opcontrol-parental/keys
      - ./data/releases:/var/lib/opcontrol-parental/releases
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  updater:
    image: ${UPDATER_IMAGE:-ghcr.io/ziur-vela/parental-opcontrol-updater:latest}
    container_name: parental-updater
    restart: unless-stopped
    environment:
      UPDATER_SECRET: ${UPDATER_SECRET:?set UPDATER_SECRET in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      STACK_DIR: ${STACK_DIR:?set STACK_DIR to the absolute path of this folder}
      STACK_NETWORK: ${COMPOSE_PROJECT_NAME:-opcontrol-parental}_default
      STACK_PROJECT: ${COMPOSE_PROJECT_NAME:-opcontrol-parental}
      WEB_CONTAINER: parental-web
      WEB_URL: http://web:8080
      BACKUPS_PATH: /data/backups
      DB_HOST: db
      DB_USER: parental
      DB_NAME: parental
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${STACK_DIR}:${STACK_DIR}
      - ./data/updater:/data
    depends_on:
      web:
        condition: service_started
