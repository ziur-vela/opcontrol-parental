<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b1714">
<title>Parental OpControl: offline</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b1714; color: #e3ece8; font-family: "Segoe UI", system-ui, sans-serif; }
  main { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 24px; box-sizing: border-box; text-align: center; }
  img { width: 72px; height: 72px; }
  h1 { margin: 0; font-size: 22px; }
  p { margin: 0; color: #7f9a92; max-width: 420px; line-height: 1.5; }
  button { margin-top: 8px; min-height: 44px; padding: 0 22px; border: 0; background: #00c853; color: #04150b; font: 600 13px ui-monospace, Consolas, monospace; letter-spacing: .08em; cursor: pointer; }
</style>
</head>
<body>
<main>
  <img src="/brand/app-icon-192.png" alt="">
  <h1>You're offline</h1>
  <p>The family dashboard needs a connection to your server. It will come back as soon as you're online.</p>
  <p lang="es">Sin conexión. El panel familiar necesita conexión con tu servidor y volverá en cuanto estés en línea.</p>
  <button type="button" onclick="location.reload()">TRY AGAIN · REINTENTAR</button>
</main>
</body>
</html>
